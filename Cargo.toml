[package]
name = "paintcp"
version = "0.1.0"
edition = "2021"
description = "PaintCP - un semplice programma di disegno per macOS, scritto in Rust"
license = "MIT"

[dependencies]
eframe = "0.37"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
rfd = { version = "0.18", default-features = false, features = ["xdg-portal"] }

[profile.release]
opt-level = 2
lto = true
strip = true

[[bin]]
name = "paintcp"
path = "src/main.rs"
